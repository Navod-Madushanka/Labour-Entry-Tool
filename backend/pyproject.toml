[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labour-entry-tool"
version = "0.1.0"
description = "Search, suggestions and validation for the monthly labour entry workbook (writes into the open Excel book)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",  # plain: the extras (uvloop, httptools, watchfiles, ...) are not needed here
    "pydantic>=2.6",
    "pyyaml>=6",
    "pyxlsb>=1.0.10",
    "python-calamine>=0.3",  # fast .xlsb reading of the day sheets (falls back to pyxlsb)
    "openpyxl>=3.1",
    "xlwings>=0.31; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.7", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "static/app/*", "static/app/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "golden: runs against real or sanitized INDIAN snapshot fixtures (skipped when absent)",
    "excel: needs desktop Excel on Windows",
]
